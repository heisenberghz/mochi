name: CI

# Every push runs the whole battery: lint, typecheck, unit tests, build.
# The smoke harness is Windows-only and drives a real desktop, so it stays
# local — CI proves the code compiles, tests and builds anywhere.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

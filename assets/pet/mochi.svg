<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mochi.

  The character's artwork. Every position here is the contract in
  docs/03-design/character-art-contract.md, and the class names are what the
  animations in pet.css hook onto. Do not rename a class without changing the
  stylesheet too.

  The drawing is soft-real: real cat proportions, shading that is a gradient
  between the palette tokens, glossy eyes. The scarf is no longer part of the
  base art — three opt-in scarves live in the accessory groups below, hidden
  until the Locker equips one.

  Anchors: head (100, 78) · body (100, 158) · scarf knot (100, 120)
           hat (100, 44) · glasses (100, 76) · paw (146, 176) · ground (100, 216)
-->
<svg xmlns="http://www.w3.org/2000/svg" class="pet-svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="mochi-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3E6" />
      <stop offset="45%" stop-color="#F3E7D6" />
      <stop offset="100%" stop-color="#E4D2BB" />
    </linearGradient>
    <linearGradient id="mochi-aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EC8A9" />
      <stop offset="100%" stop-color="#9A7FD1" />
    </linearGradient>
    <linearGradient id="mochi-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FA3C7" />
      <stop offset="100%" stop-color="#5F86B1" />
    </linearGradient>
  </defs>

  <!-- Ground: the contact shadow, and later a bed. -->
  <ellipse
    class="contact-shadow"
    cx="100"
    cy="216"
    rx="60"
    ry="9"
    fill="#2A2622"
    opacity="0.12"
  />

  <!-- Bed: unlocks at level 10, shown while sleeping. -->
  <g class="accessory bed">
    <ellipse cx="100" cy="216" rx="56" ry="7" fill="#2A2622" opacity="0.12" />
    <rect x="74" y="200" width="52" height="10" rx="5" fill="#FFF8EC" stroke="#CBB69C" stroke-width="1" />
  </g>

  <g class="facing">
    <g class="character">
      <!-- Tail: behind the body, curling out to the right and tapering. -->
      <g class="tail-group">
        <path
          class="tail-outline"
          d="M 151 168 C 176 154 192 168 186 190 C 181 205 164 206 156 196"
          stroke="#2A2622"
          stroke-width="16"
          stroke-linecap="round"
          fill="none"
          opacity="0.06"
        />
        <path
          class="tail"
          d="M 151 168 C 176 154 192 168 186 190 C 181 205 164 206 156 196"
          stroke="#E4D2BB"
          stroke-width="13"
          stroke-linecap="round"
          fill="none"
        />
        <!-- The lit rim along the top of the tail, and the pale tip. -->
        <path
          d="M 151 167.5 C 175 153.5 190 166.5 185 188"
          stroke="#FBF3E6"
          stroke-width="3.5"
          stroke-linecap="round"
          fill="none"
          opacity="0.7"
        />
        <circle cx="157" cy="196.5" r="6" fill="#FBF3E6" />
      </g>

      <!-- The far paws: behind the body, dimmer, so the walk has four feet. -->
      <ellipse class="paw paw-far-left" cx="62" cy="206" rx="13" ry="7" fill="#E4D2BB" opacity="0.85" />
      <ellipse class="paw paw-far-right" cx="138" cy="206" rx="13" ry="7" fill="#E4D2BB" opacity="0.85" />

      <!-- Body: a rounded pear, wider than the head. -->
      <path
        class="body"
        d="M 100 106 C 128 106 148 124 151 152 C 154 182 142 210 100 210 C 58 210 46 182 49 152 C 52 124 72 106 100 106 Z"
        fill="url(#mochi-body)"
      />
      <!-- Ambient occlusion where the head meets the body. -->
      <ellipse class="body-shade" cx="100" cy="118" rx="42" ry="9" fill="#CBB69C" opacity="0.3" />
      <!-- A lit rim along the top-left of the body. -->
      <path
        class="body-rim"
        d="M 63 130 C 70 114 85 107 99 106.5"
        stroke="#FBF3E6"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
        opacity="0.8"
      />
      <ellipse class="belly" cx="100" cy="158" rx="34" ry="26" fill="#FFFDF8" opacity="0.55" />

      <!-- Scarf moss: an opt-in cosmetic at the neck seam. -->
      <g class="accessory scarf scarf-moss">
        <path
          class="scarf-back"
          d="M 62 104 C 50 112 44 128 47 144 C 48 152 53 158 58 156 C 52 142 54 122 66 112 Z"
          fill="#6E8E5F"
        />
        <path
          class="scarf-band"
          d="M 49 102 C 68 112 132 112 151 102 L 153 117 C 132 127 68 127 47 117 Z"
          fill="#8FAE7C"
        />
        <circle class="scarf-knot" cx="100" cy="118" r="8" fill="#6E8E5F" />
        <path
          class="scarf-tail"
          d="M 104 122 C 112 131 111 143 102 150 L 92 143 C 99 136 99 127 95 120 Z"
          fill="#8FAE7C"
        />
      </g>

      <!-- Scarf sky: the same shapes, the sky colour. -->
      <g class="accessory scarf scarf-sky">
        <path
          class="scarf-back"
          d="M 62 104 C 50 112 44 128 47 144 C 48 152 53 158 58 156 C 52 142 54 122 66 112 Z"
          fill="#5F86B1"
        />
        <path
          class="scarf-band"
          d="M 49 102 C 68 112 132 112 151 102 L 153 117 C 132 127 68 127 47 117 Z"
          fill="url(#mochi-sky)"
        />
        <circle class="scarf-knot" cx="100" cy="118" r="8" fill="#5F86B1" />
        <path
          class="scarf-tail"
          d="M 104 122 C 112 131 111 143 102 150 L 92 143 C 99 136 99 127 95 120 Z"
          fill="#7FA3C7"
        />
      </g>

      <!-- Scarf aurora: the same shapes, the aurora wash. -->
      <g class="accessory scarf scarf-aurora">
        <path
          class="scarf-back"
          d="M 62 104 C 50 112 44 128 47 144 C 48 152 53 158 58 156 C 52 142 54 122 66 112 Z"
          fill="#9A7FD1"
        />
        <path
          class="scarf-band"
          d="M 49 102 C 68 112 132 112 151 102 L 153 117 C 132 127 68 127 47 117 Z"
          fill="url(#mochi-aurora)"
        />
        <circle class="scarf-knot" cx="100" cy="118" r="8" fill="#9A7FD1" />
        <path
          class="scarf-tail"
          d="M 104 122 C 112 131 111 143 102 150 L 92 143 C 99 136 99 127 95 120 Z"
          fill="#7EC8A9"
        />
      </g>

      <!-- Head: a distinct shape, so the face sits where it should. -->
      <g class="head">
        <g class="ears">
          <path
            class="ear ear-left"
            d="M 57 68 C 55 48 57 36 63 34 C 73 40 83 47 91 56 C 78 52 65 56 57 68 Z"
            fill="#F3E7D6"
          />
          <path
            class="inner-ear inner-ear-left"
            d="M 65 60 C 64 47 65 40 68 38 C 74 42 81 47 85 52 C 77 50 70 53 65 60 Z"
            fill="#E8B7A6"
          />
          <path
            class="ear ear-right"
            d="M 143 68 C 145 48 143 36 137 34 C 127 40 117 47 109 56 C 122 52 135 56 143 68 Z"
            fill="#F3E7D6"
          />
          <path
            class="inner-ear inner-ear-right"
            d="M 135 60 C 136 47 135 40 132 38 C 126 42 119 47 115 52 C 123 50 130 53 135 60 Z"
            fill="#E8B7A6"
          />
        </g>
        <path
          class="head-shape"
          d="M 100 40 C 128 40 147 55 147 78 C 147 90 144 98 139 105 C 132 112 118 116 100 116 C 82 116 68 112 61 105 C 56 98 53 90 53 78 C 53 55 72 40 100 40 Z"
          fill="url(#mochi-body)"
        />
        <!-- A lit rim along the top-left of the head. -->
        <path
          d="M 68 53 C 76 45 88 40.5 98 40"
          stroke="#FBF3E6"
          stroke-width="3"
          stroke-linecap="round"
          fill="none"
          opacity="0.8"
        />
        <!-- Leaf hat: unlocks at level 2. -->
        <g class="accessory leaf-hat">
          <path d="M 89 44 Q 100 31 111 44 Q 100 52 89 44 Z" fill="#8FAE7C" />
          <path d="M 100 43.5 L 100 34.5" stroke="#6E8E5F" stroke-width="1" stroke-linecap="round" />
        </g>
      </g>

      <!-- Face: on the head, at the face anchor. Glossy eyes, two highlights. -->
      <g class="face">
        <g class="eye-open eye-left">
          <ellipse cx="80" cy="76" rx="7" ry="9" fill="#2A2622" />
          <ellipse cx="77.5" cy="72.5" rx="3" ry="3.2" fill="#FFFDF8" />
          <ellipse cx="82.8" cy="79.6" rx="1.3" ry="1.3" fill="#FFFDF8" opacity="0.85" />
        </g>
        <g class="eye-open eye-right">
          <ellipse cx="120" cy="76" rx="7" ry="9" fill="#2A2622" />
          <ellipse cx="117.5" cy="72.5" rx="3" ry="3.2" fill="#FFFDF8" />
          <ellipse cx="122.8" cy="79.6" rx="1.3" ry="1.3" fill="#FFFDF8" opacity="0.85" />
        </g>
        <g class="eye-closed">
          <path d="M 72 78 Q 80 84 88 78" stroke="#2A2622" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M 112 78 Q 120 84 128 78" stroke="#2A2622" stroke-width="3" stroke-linecap="round" fill="none" />
        </g>
        <ellipse cx="72" cy="87" rx="6.5" ry="3.6" fill="#E8B7A6" opacity="0.55" />
        <ellipse cx="128" cy="87" rx="6.5" ry="3.6" fill="#E8B7A6" opacity="0.55" />
        <path d="M 95 85 L 105 85 L 100.5 90.6 Q 100 91.2 99.5 90.6 Z" fill="#2A2622" />
        <path
          class="mouth"
          d="M 94 94 Q 97 98 100 94 Q 103 98 106 94"
          stroke="#2A2622"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />
        <g class="whiskers" stroke="#CBB69C" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
          <path d="M 66 82 L 50 78" />
          <path d="M 66 87 L 50 87" />
          <path d="M 134 82 L 150 78" />
          <path d="M 134 87 L 150 87" />
        </g>
      </g>

      <!-- Paws: resting on the ground, toe lines in the deep fur tone. -->
      <g class="paws">
        <ellipse class="paw paw-left" cx="80" cy="202" rx="17" ry="10" fill="#E4D2BB" />
        <ellipse class="paw paw-right" cx="120" cy="202" rx="17" ry="10" fill="#E4D2BB" />
        <path
          d="M 75 202 L 75 206 M 85 202 L 85 206 M 115 202 L 115 206 M 125 202 L 125 206"
          stroke="#CBB69C"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </g>

      <!-- Mug: unlocks at level 5, held at the right paw. -->
      <g class="accessory mug">
        <path d="M 142.5 166 C 141.5 164 143 163 142.2 161" stroke="#B9A48B" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65" />
        <path d="M 147.5 166 C 146.5 164 148 163 147.2 161" stroke="#B9A48B" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65" />
        <rect x="140" y="168" width="12" height="11" rx="2" fill="#D98C45" />
        <path d="M 152 170.5 C 156 170.5 156 177.5 152 177.5" stroke="#D98C45" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>

      <!-- Glasses: worn by default, sitting on the face anchor. -->
      <g class="glasses">
        <circle cx="80" cy="76" r="12" fill="none" stroke="#2A2622" stroke-width="2.4" />
        <circle cx="120" cy="76" r="12" fill="none" stroke="#2A2622" stroke-width="2.4" />
        <path d="M 92 74 L 108 74" stroke="#2A2622" stroke-width="2.4" stroke-linecap="round" />
        <path d="M 68 72 L 60 70 M 132 72 L 140 70" stroke="#2A2622" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Sleep curl: a second pose, shown only while asleep. The head is
           tucked against the left of a squat oval, and the tail is wrapped
           along its front. -->
      <g class="sleep-curl">
        <ellipse class="curl-body" cx="100" cy="194" rx="52" ry="18" fill="url(#mochi-body)" />
        <ellipse cx="64" cy="197" rx="24" ry="5" fill="#CBB69C" opacity="0.25" />
        <g class="curl-tail">
          <path d="M 148 202 C 128 210 78 210 64 202" stroke="#E4D2BB" stroke-width="7" stroke-linecap="round" fill="none" />
          <circle cx="63" cy="201.5" r="3.5" fill="#FBF3E6" />
        </g>
        <g class="curl-head">
          <g class="curl-ears">
            <path class="curl-ear curl-ear-left" d="M 46 171 C 44 160 47 154 51 152.5 C 56 156 61 160 65 165 C 57 163 50 166 46 171 Z" fill="#F3E7D6" />
            <path d="M 51 165 C 50.5 159 51.5 156 53 155 C 56 157 59 160 61 163 C 56 162 53 163 51 165 Z" fill="#E8B7A6" />
            <path class="curl-ear curl-ear-right" d="M 66 164 C 67 155 71 151 75 150 C 79 154 83 158 86 163 C 79 161 71 162 66 164 Z" fill="#F3E7D6" />
            <path d="M 71 160 C 71.5 156 73 154 74.5 153.5 C 77 156 79.5 158.5 81 161 C 77 160 74 160 71 160 Z" fill="#E8B7A6" />
          </g>
          <circle class="curl-head-shape" cx="62" cy="180" r="20" fill="url(#mochi-body)" />
          <path d="M 47 172 C 49 166.5 53 163 58 161.5" stroke="#FBF3E6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
          <g class="curl-eyes">
            <path d="M 51 181 Q 56 185 61 181" stroke="#2A2622" stroke-width="2.4" stroke-linecap="round" fill="none" />
            <path d="M 67 181 Q 72 185 77 181" stroke="#2A2622" stroke-width="2.4" stroke-linecap="round" fill="none" />
          </g>
          <path d="M 62.5 187.5 L 65.5 187.5 L 64.3 190 Q 64 190.5 63.7 190 Z" fill="#2A2622" />
        </g>
      </g>
    </g>
  </g>

  <!-- Effects: drawn in front, and only shown when they are wanted. -->
  <g class="zzz">
    <g transform="translate(146 66) scale(0.75)">
      <path class="zzz-letter zzz-one" d="M 0 0 H 10 L 3 8 H 10 V 11 H 0 L 7 3 H 0 Z" fill="#2A2622" />
    </g>
    <g transform="translate(160 46) scale(0.95)">
      <path class="zzz-letter zzz-two" d="M 0 0 H 10 L 3 8 H 10 V 11 H 0 L 7 3 H 0 Z" fill="#2A2622" />
    </g>
    <g transform="translate(176 22) scale(1.15)">
      <path class="zzz-letter zzz-three" d="M 0 0 H 10 L 3 8 H 10 V 11 H 0 L 7 3 H 0 Z" fill="#2A2622" />
    </g>
  </g>

  <g class="sparkles">
    <circle class="sparkle sparkle-one" cx="48" cy="76" r="3.2" />
    <circle class="sparkle sparkle-two" cx="156" cy="84" r="2.5" />
    <circle class="sparkle sparkle-three" cx="40" cy="126" r="2" />
    <circle class="sparkle sparkle-four" cx="164" cy="136" r="3" />
    <path
      class="sparkle sparkle-five"
      d="M 100 30 l 2.6 5.2 5.8 .8 -4.2 4.1 1 5.8 -5.2 -2.8 -5.2 2.8 1 -5.8 -4.2 -4.1 5.8 -.8 z"
    />
  </g>
</svg>
